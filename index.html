<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loafer Burger - لوحة التحكم</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ─── Supabase ────────────────────────────────────────────────────────────────
        const SB_URL = "https://ksbnqploabzncftwmyju.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzYm5xcGxvYWJ6bmNmdHdteWp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NjU2NjcsImV4cCI6MjA5NjQ0MTY2N30.3mWLMIEfuXOLJay7Wi2pYXMcgfZN1fmLXVtooKh_rkc";

        const H = {
          apikey: SB_KEY,
          Authorization: `Bearer ${SB_KEY}`,
          "Content-Type": "application/json",
          Prefer: "return=representation",
        };

        async function fetchOrders() {
          const r = await fetch(`${SB_URL}/rest/v1/orders?select=*&order=created_at.desc`, { headers: H });
          return r.json();
        }

        async function updateOrderStatus(id, status) {
          const r = await fetch(`${SB_URL}/rest/v1/orders?id=eq.${id}`, {
            method: "PATCH", headers: H, body: JSON.stringify({ status }),
          });
          return r.ok;
        }

        // ─── CSS ─────────────────────────────────────────────────────────────────────
        const CSS = `
          @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700;800;900&display=swap');

          *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

          :root {
            --bg:       #0b0d0f;
            --surface:  #111518;
            --card:     #171b1f;
            --card2:    #1e2328;
            --border:   #272d33;
            --gold:     #c9963a;
            --gold2:    #e8b84b;
            --cream:    #e8dece;
            --muted:    #6a7480;
            --text:     #d8d0c4;
            --green:    #3a7a4a;
            --green2:   #4a9a5a;
            --blue:     #2a4a8a;
            --blue2:    #3a60b0;
            --red:      #8a2a2a;
            --red2:     #b03a3a;
          }

          body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            background: var(--bg);
            color: var(--text);
            direction: rtl;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
          }

          ::-webkit-scrollbar { width: 4px; }
          ::-webkit-scrollbar-track { background: var(--surface); }
          ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 2px; }

          @keyframes up   { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
          @keyframes spin { to { transform:rotate(360deg); } }
          @keyframes fade { from{opacity:0} to{opacity:1} }
          @keyframes ping { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.4);opacity:.6} }

          .tajawal { font-family: 'Tajawal', sans-serif; }
          button { cursor: pointer; font-family: inherit; }
          .hscroll { overflow-x: auto; scrollbar-width: none; }
          .hscroll::-webkit-scrollbar { display: none; }
          .card-hover { transition: border-color .2s, transform .2s; }
          .card-hover:hover { transform: translateY(-1px); }
        `;

        // ─── Helpers ─────────────────────────────────────────────────────────────────
        function fmt(n) { return Number(n || 0).toLocaleString("ar-IQ") + " د.ع"; }

        function timeAgo(iso) {
          if (!iso) return "";
          const diff = Math.floor((Date.now() - new Date(iso)) / 1000);
          if (diff < 60) return \`منذ \${diff} ث\`;
          if (diff < 3600) return \`منذ \${Math.floor(diff / 60)} د\`;
          if (diff < 86400) return \`منذ \${Math.floor(diff / 3600)} سا\`;
          return new Date(iso).toLocaleDateString("ar-IQ");
        }

        function Toast({ msg, type, onClose }) {
          useEffect(() => { const t = setTimeout(onClose, 2500); return () => clearTimeout(t); }, []);
          const bg = type === "error" ? "#7a1a1a" : type === "warn" ? "#6a5010" : "#1a3a2a";
          return (
            <div style={{
              position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)",
              background: bg, color: "#fff", padding: "12px 22px", borderRadius: 12, fontWeight: 600, fontSize: 14,
              zIndex: 9999, animation: "up .3s ease", boxShadow: "0 8px 32px rgba(0,0,0,.6)",
              display: "flex", alignItems: "center", gap: 8, whiteSpace: "nowrap",
            }}>
              {type === "error" ? "✕" : "✓"} {msg}
            </div>
          );
        }

        const STATUS = {
          pending:   { label: "جديد",     color: "#e8b84b", bg: "#2a2010", dot: "#e8b84b" },
          preparing: { label: "يتحضر",    color: "#5a8adf", bg: "#101828", dot: "#5a8adf" },
          done:      { label: "جاهز",     color: "#5aba7a", bg: "#0f2018", dot: "#5aba7a" },
          cancelled: { label: "ملغي",     color: "#ba5a5a", bg: "#200f0f", dot: "#ba5a5a" },
        };

        function StatCard({ icon, label, value, color, sub, i }) {
          return (
            <div style={{
              background: "var(--card)", border: "1px solid var(--border)", borderRadius: 16,
              padding: "18px 20px", animation: \`up .35s ease \${i * .08}s both\`,
            }}>
              <div style={{ fontSize: 28, marginBottom: 8 }}>{icon}</div>
              <div className="tajawal" style={{ fontSize: 28, fontWeight: 900, color, lineHeight: 1 }}>{value}</div>
              <div style={{ fontSize: 12, color: "var(--muted)", fontWeight: 600, marginTop: 4 }}>{label}</div>
              {sub && <div style={{ fontSize: 11, color: "var(--gold)", fontWeight: 700, marginTop: 6 }}>{sub}</div>}
            </div>
          );
        }

        function OrderCard({ order, onUpdate, i }) {
          const [busy, setBusy] = useState(false);
          const sc = STATUS[order.status] || STATUS.pending;

          let items = [];
          try { items = typeof order.items === "string" ? JSON.parse(order.items) : (order.items || []); } catch {}

          async function handleUpdate(status) {
            setBusy(true);
            await onUpdate(order.id, status);
            setBusy(false);
          }

          const isNew = order.status === "pending";

          return (
            <div className="card-hover" style={{
              background: "var(--card)", border: \`1px solid \${isNew ? "rgba(232,184,75,.35)" : "var(--border)"}\`,
              borderRadius: 18, overflow: "hidden", animation: \`up .35s ease \${i * .06}s both\`,
              boxShadow: isNew ? "0 0 0 1px rgba(232,184,75,.15), 0 8px 32px rgba(0,0,0,.3)" : "none",
            }}>
              <div style={{
                background: isNew ? "rgba(232,184,75,.06)" : "var(--card2)", padding: "14px 18px",
                display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "1px solid var(--border)",
              }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  {isNew && (
                    <span style={{ position: "relative", display: "inline-block", width: 10, height: 10 }}>
                      <span style={{ position: "absolute", inset: 0, borderRadius: "50%", background: "var(--gold)", animation: "ping 1.5s ease infinite" }} />
                      <span style={{ position: "absolute", inset: 1, borderRadius: "50%", background: "var(--gold2)" }} />
                    </span>
                  )}
                  <div>
                    <span className="tajawal" style={{ fontWeight: 900, fontSize: 18, color: "var(--cream)" }}>طاولة {order.table_number}</span>
                    <span style={{ color: "var(--muted)", fontSize: 12, marginRight: 8 }}>#{String(order.id).slice(-5)} · {timeAgo(order.created_at)}</span>
                  </div>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span className="tajawal" style={{ fontWeight: 900, fontSize: 18, color: "var(--gold2)" }}>{fmt(order.total)}</span>
                  <span style={{
                    background: sc.bg, color: sc.color, borderRadius: 8, padding: "4px 12px", fontSize: 12, fontWeight: 700,
                    border: \`1px solid \${sc.color}22\`,
                  }}>{sc.label}</span>
                </div>
              </div>

              <div style={{ padding: "12px 18px" }}>
                {items.map((item, j) => (
                  <div key={j} style={{
                    display: "flex", justifyContent: "space-between", padding: "6px 0",
                    borderBottom: j < items.length - 1 ? "1px solid var(--border)" : "none", fontSize: 13,
                  }}>
                    <span style={{ color: "var(--text)" }}>
                      {item.emoji ? \`\${item.emoji} \` : ""}{item.name_ar || item.name}
                      <span style={{
                        background: "var(--card2)", border: "1px solid var(--border)", borderRadius: 6, padding: "1px 7px", fontSize: 11,
                        color: "var(--gold)", fontWeight: 700, marginRight: 6,
                      }}>×{item.qty}</span>
                    </span>
                    <span style={{ color: "var(--muted)" }}>{fmt(item.price * item.qty)}</span>
                  </div>
                ))}
                {order.notes && (
                  <div style={{
                    marginTop: 10, background: "rgba(232,184,75,.07)", border: "1px solid rgba(232,184,75,.2)",
                    borderRadius: 10, padding: "8px 12px", fontSize: 12, color: "var(--gold)", fontStyle: "italic",
                  }}>📝 {order.notes}</div>
                )}
              </div>

              <div style={{
                padding: "12px 18px 16px", borderTop: "1px solid var(--border)", display: "flex", gap: 8, flexWrap: "wrap",
              }}>
                {order.status === "pending" && <ActionBtn label="ابدأ التحضير 👨‍🍳" color={["var(--blue)", "var(--blue2)"]} onClick={() => handleUpdate("preparing")} disabled={busy} />}
                {order.status === "preparing" && <ActionBtn label="جاهز للتسليم ✅" color={["var(--green)", "var(--green2)"]} onClick={() => handleUpdate("done")} disabled={busy} />}
                {(order.status === "pending" || order.status === "preparing") && <ActionBtn label="إلغاء" color={["var(--red)", "var(--red2)"]} onClick={() => handleUpdate("cancelled")} disabled={busy} ghost />}
                {(order.status === "done" || order.status === "cancelled") && <span style={{ color: "var(--muted)", fontSize: 12, fontWeight: 600, padding: "8px 0" }}>{order.status === "done" ? "✅ تم التسليم" : "❌ ملغي"}</span>}
              </div>
            </div>
          );
        }

        function ActionBtn({ label, color, onClick, disabled, ghost }) {
          return (
            <button onClick={onClick} disabled={disabled} style={{
              padding: "9px 18px", borderRadius: 10, fontWeight: 700, fontSize: 13,
              border: ghost ? \`1px solid \${color[0]}\` : "none",
              background: ghost ? "transparent" : \`linear-gradient(135deg, \${color[0]}, \${color[1]})\`,
              color: ghost ? color[1] : "#fff", opacity: disabled ? .6 : 1, transition: "opacity .15s, transform .15s",
              fontFamily: "'Tajawal', sans-serif",
            }}>{disabled ? "..." : label}</button>
          );
        }

        // ─── Main App ─────────────────────────────────────────────────────────────────
        function AdminApp() {
          const [orders, setOrders]   = useState([]);
          const [loading, setLoading] = useState(true);
          const [filter, setFilter]   = useState("all");
          const [toast, setToast]     = useState(null);
          const [lastCount, setLastCount] = useState(0);
          const timerRef = useRef(null);

          const load = useCallback(async (silent = false) => {
            if (!silent) setLoading(true);
            try {
              const data = await fetchOrders();
              if (Array.isArray(data)) {
                setOrders(data);
                const pending = data.filter(o => o.status === "pending").length;
                if (pending > lastCount && lastCount > 0) {
                  setToast({ msg: \`جاء طلب جديد! 🔔\`, type: "warn" });
                }
                setLastCount(pending);
              }
            } catch { /* offline */ }
            if (!silent) setLoading(false);
          }, [lastCount]);

          useEffect(() => {
            load();
            timerRef.current = setInterval(() => load(true), 12000);
            return () => clearInterval(timerRef.current);
          }, []);

          async function handleUpdate(id, status) {
            const ok = await updateOrderStatus(id, status);
            if (ok) {
              setOrders(prev => prev.map(o => o.id === id ? { ...o, status } : o));
              const labels = { preparing: "بدأ التحضير 👨‍🍳", done: "جاهز ✅", cancelled: "ملغي ❌" };
              setToast({ msg: labels[status] || "تم التحديث", type: "ok" });
            } else {
              setToast({ msg: "صار خطأ، حاول ثاني", type: "error" });
            }
          }

          const total    = orders.length;
          const pending  = orders.filter(o => o.status === "pending").length;
          const preparing = orders.filter(o => o.status === "preparing").length;
          const done     = orders.filter(o => o.status === "done").length;
          const revenue  = orders.filter(o => o.status !== "cancelled").reduce((s, o) => s + (o.total || 0), 0);

          const FILTERS = [
            { key: "all",       label: \`الكل (\${total})\` },
            { key: "pending",   label: \`جديد (\${pending})\` },
            { key: "preparing", label: \`يتحضر (\${preparing})\` },
            { key: "done",      label: \`جاهز (\${done})\` },
            { key: "cancelled", label: "ملغي" },
          ];

          const visible = filter === "all" ? orders : orders.filter(o => o.status === filter);

          return (
            <>
              <style>{CSS}</style>
              {toast && <Toast {...toast} onClose={() => setToast(null)} />}

              <div style={{ display: "flex", flexDirection: "column", minHeight: "100vh" }}>
                <header style={{
                  background: "var(--surface)", borderBottom: "1px solid var(--border)", padding: "0 24px", height: 62,
                  display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0, zIndex: 100,
                }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                    <div style={{
                      width: 38, height: 38, borderRadius: 10, background: "linear-gradient(135deg, var(--gold), var(--gold2))",
                      display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20,
                    }}>🍔</div>
                    <div>
                      <div className="tajawal" style={{ fontWeight: 900, fontSize: 16, lineHeight: 1, color: "var(--cream)" }}>LOAFER BURGER</div>
                      <div style={{ fontSize: 9, letterSpacing: 3, color: "var(--gold)", lineHeight: 1 }}>ADMIN PANEL</div>
                    </div>
                    <div style={{
                      background: "rgba(90,186,122,.12)", border: "1px solid rgba(90,186,122,.3)", borderRadius: 20, padding: "3px 10px",
                      display: "flex", alignItems: "center", gap: 5,
                    }}>
                      <span style={{ width: 7, height: 7, borderRadius: "50%", background: "#5aba7a", animation: "ping 2s ease infinite", display: "inline-block" }} />
                      <span style={{ fontSize: 11, color: "#5aba7a", fontWeight: 700 }}>مباشر</span>
                    </div>
                  </div>

                  <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    {pending > 0 && (
                      <div style={{
                        background: "rgba(232,184,75,.12)", border: "1px solid rgba(232,184,75,.3)", borderRadius: 8, padding: "5px 12px",
                        fontSize: 12, fontWeight: 700, color: "var(--gold2)", display: "flex", alignItems: "center", gap: 6,
                      }}>🔔 {pending} طلب جديد</div>
                    )}
                    <button onClick={() => load()} style={{
                      background: "var(--card2)", border: "1px solid var(--border)", borderRadius: 8, padding: "7px 14px",
                      color: "var(--muted)", fontSize: 13, fontWeight: 600, display: "flex", alignItems: "center", gap: 6,
                    }}>↺ تحديث</button>
                  </div>
                </header>

                <div style={{ flex: 1, padding: "24px 20px 80px", maxWidth: 800, margin: "0 auto", width: "100%" }}>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(2,1fr)", gap: 12, marginBottom: 24 }}>
                    <StatCard icon="📋" label="طلبات اليوم" value={total} color="var(--cream)" i={0} />
                    <StatCard icon="🔔" label="طلبات جديدة" value={pending} color="var(--gold2)" sub={pending > 0 ? "يحتاج انتباهك!" : undefined} i={1} />
                    <StatCard icon="👨‍🍳" label="قيد التحضير" value={preparing} color="#5a8adf" i={2} />
                    <StatCard icon="💰" label="إيرادات اليوم" value={fmt(revenue)} color="#5aba7a" i={3} />
                  </div>

                  <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 16 }}>
                    <div style={{ flex: 1, height: 1, background: "var(--border)" }} />
                    <span className="tajawal" style={{ fontWeight: 800, fontSize: 16, color: "var(--cream)" }}>الطلبات</span>
                    <div style={{ flex: 1, height: 1, background: "var(--border)" }} />
                  </div>

                  <div className="hscroll" style={{ display: "flex", gap: 8, marginBottom: 18 }}>
                    {FILTERS.map(f => (
                      <button key={f.key} onClick={() => setFilter(f.key)} style={{
                        flexShrink: 0, padding: "8px 16px", borderRadius: 20, background: filter === f.key ? "var(--gold)" : "var(--card)",
                        border: filter === f.key ? "none" : "1px solid var(--border)", color: filter === f.key ? "#0b0d0f" : "var(--muted)",
                        fontFamily: "'Tajawal', sans-serif", fontWeight: 700, fontSize: 13, transition: "all .18s",
                      }}>{f.label}</button>
                    ))}
                  </div>

                  {loading ? (
                    <div style={{ display: "flex", justifyContent: "center", padding: 60 }}>
                      <div style={{
                        width: 36, height: 36, border: "3px solid var(--border)", borderTop: "3px solid var(--gold)",
                        borderRadius: "50%", animation: "spin .8s linear infinite",
                      }} />
                    </div>
                  ) : visible.length === 0 ? (
                    <div style={{ textAlign: "center", padding: "64px 0", animation: "fade .4s ease" }}>
                      <div style={{ fontSize: 56, marginBottom: 16 }}>📭</div>
                      <div className="tajawal" style={{ fontSize: 20, fontWeight: 800, color: "var(--muted)" }}>ما في طلبات هنا</div>
                    </div>
                  ) : (
                    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                      {visible.map((order, i) => <OrderCard key={order.id} order={order} onUpdate={handleUpdate} i={i} />)}
                    </div>
                  )}
                </div>

                <div style={{
                  borderTop: "1px solid var(--border)", padding: "12px 24px", display: "flex", justifyContent: "space-between",
                  alignItems: "center", background: "var(--surface)",
                }}>
                  <span style={{ fontSize: 11, color: "var(--muted)" }}>آخر تحديث: {new Date().toLocaleTimeString("ar-IQ")}</span>
                  <span className="tajawal" style={{ fontSize: 12, color: "var(--gold)", fontWeight: 700 }}>Loafer Burger © 2025</span>
                </div>
              </div>
            </>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminApp />);
    </script>
</body>
</html>
